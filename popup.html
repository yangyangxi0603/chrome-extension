<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: Arial;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 14px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: green;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <textarea id="playlistUrl"
    placeholder="粘贴 YouTube 播放列表 URL">
  </textarea>

  <button id="exportBtn">
    导出播放列表 URL
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>

</body>
</html>
